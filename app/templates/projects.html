{% extends "base.html" %}

{% block title %}프로젝트{% endblock %}

{% block content %}
<h1>프로젝트</h1>
<p>참여한 프로젝트와 사용 기술 스택, 상세 설명입니다.</p>
{% for project in projects %}
<div class="card">
    <h3 style="margin-top: 0;">{{ project.title }}</h3>
    <p>
        {% for tech in project.stack %}<span class="tag">{{ tech }}</span>{% endfor %}
    </p>
    <p style="color: var(--muted); margin-bottom: 0;">{{ project.description }}</p>
</div>
{% endfor %}
{% endblock %}
