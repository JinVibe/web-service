# Sphinx HTML → GitHub Pages (main 푸시 시 배포, PR 시 빌드만 검증)
# 저장소 Settings → Pages → Build and deployment → Source: GitHub Actions 로 설정해야 합니다.

name: Docs (Sphinx) — build & Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 프로젝트 사이트( https://owner.github.io/repo/ )용 base URL.
      # 저장소가 USERNAME.github.io 인 루트 사이트면 html_baseurl을 https://USERNAME.github.io/ 로 바꾸세요.
      - name: Build Sphinx HTML
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: sphinx-build -M html docs/source docs/build -W -D "html_baseurl=${PAGES_BASE_URL}"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
